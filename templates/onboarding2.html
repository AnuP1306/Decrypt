<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Onboarding - Step 2</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Space+Grotesk:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/onboarding2.css') }}">

    <!-- ✅ ADD THIS (layout fix) -->
    <style>
        .options {
            display: flex;
            flex-direction: column;
            gap: 16px;
            /* consistent spacing between boxes */
            margin-top: 20px;
        }

        .option {
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #ccc;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.2s ease;
        }

        .option:hover {
            background: #f5f5f5;
        }

        .option.active {
            background: linear-gradient(135deg, #4f46e5, #4338ca) !important;
            color: #ffffff !important;
            border: none !important;
        }

        .option.active * {
            color: #ffffff !important;
        }
    </style>
</head>

<body>

    <div class="onboard-wrapper">

        <div class="top-bar">
            <div class="logo-row">
                <img src="{{ url_for('static', filename='images/logo.svg') }}">
                <span class="logo-text">DECRYPT</span>
            </div>

            <div class="progress-info">2 of 3</div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill step2"></div>
        </div>

        <div class="content">

            <div class="step-pill">⚡ Step 2</div>

            <h1>
                how much do you<br>
                already know?
            </h1>

            <p class="subtitle">
                no judgment, seriously
            </p>

            <!-- ✅ UPDATED OPTIONS (ONLY 3) -->
            <div class="options">

                <div class="option">
                    <span>🌱</span>
                    Beginner — I know what WiFi is and that’s it
                </div>

                <div class="option">
                    <span>📈</span>
                    Intermediate — I’ve used ChatGPT more than Google
                </div>

                <div class="option">
                    <span>🔥</span>
                    Advanced — I have opinions about programming languages
                </div>

            </div>

            <div class="actions">

                <a href="{{ url_for('auth.onboarding1') }}" class="back-link">← back</a>

                <button type="button" class="continue-btn" data-url="{{ url_for('auth.onboarding3') }}">
                    Continue →
                </button>

            </div>

        </div>

    </div>

    <script>
        const options = document.querySelectorAll('.option');
        const btn = document.querySelector('.continue-btn');

        let selected = null;

        options.forEach(option => {
            option.addEventListener('click', () => {

                options.forEach(o => o.classList.remove('active'));
                option.classList.add('active');

                selected = option.innerText.trim();

                btn.classList.add('enabled');
            });
        });

        btn.addEventListener('click', () => {
            if (!selected) return;

            sessionStorage.setItem('onboarding_step2', selected);

            console.log("Step2 saved:", selected);

            window.location.href = "/onboarding3";
        });
    </script>

</body>

</html>
