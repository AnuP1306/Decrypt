<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Brief</title>

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&amp;family=Space+Grotesk:wght@500&amp;display=swap" rel="stylesheet">

    <!-- SAME CSS AS HOMEPAGE -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/rightSidebar.css">
    <link rel="stylesheet" href="/static/css/home.css">
    <link rel="stylesheet" href="/static/css/dailyBrief.css">
</head>

<body>

<!-- ✅ NAVBAR (EXACT SAME) -->
<nav class="navbar">

    <div class="nav-left">
        <img src="/static/images/logo.svg" class="logo-img">
        <h1 class="logo-text">Decrypt</h1>
    </div>

    <div class="nav-center">
        <div class="search-wrapper">
            <img src="/static/images/search.png" class="search-icon">
            <input type="text" placeholder="Search topics, tools, news..." class="search-input">
        </div>
    </div>

    <div class="nav-right">
        <div class="notif-wrapper">
            <img src="/static/images/notification.png" class="notif-icon">
        </div>
    </div>

</nav>

<!-- ✅ MAIN LAYOUT -->
<div class="layout">
    

    {% include 'components/sidebar.html' %}

    
 



    
    <main class="main-content">

        <div class="feed-container">

            <div class="brief-top">

                
                <div class="brief-tag">
                    <img src="/static/images/bolt-1.png">
                    <span>DAILY 10-MIN NEWS</span>
                </div>
            
                <!-- MAIN HEADER ROW -->
                <div class="brief-header-row">
            
                    <!-- <h1 class="brief-title">
                        Today’s <span>Flashcards</span>
                    </h1> -->
                      <h1 class="feed-title">
               Today’s <span class="highlight-pill">Flashcards</span>
                   </h1>
            
                    <!-- <div class="brief-count">
                        <span id="cardCount">1</span>/<span id="totalCount">10</span>
                        <p>cards</p>
                    </div> -->
                    <div class="card-count">
                        <span class="count-text">
                            <span id="cardCount">1</span>/<span id="totalCount">5</span>
                        </span>
                        <span class="count-label">cards</span>
                    </div>
            
                </div>
            
                <!-- PROGRESS BAR -->
                <div class="brief-progress-wrapper">
            
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
            
                    <div class="progress-labels">
                        <span>just getting started</span>
                        <span>all caught up</span>
                    </div>
            
                </div>
            
            </div>


            <!-- 🔥 FLASHCARD (USES NEWS CARD DESIGN) -->
            <div class="news-card" id="briefCard">

    <div class="card-image">
        <img id="briefImage" src="/static/images/news1.1.png">


        <span class="domain-pill" id="briefCategory">AI</span>

        <div class="save-btn" onclick="toggleSave(this)">
            <img src="/static/images/briefbookmark.png">
        </div>
    </div>

    <div class="card-content">

        <div class="card-body">
            <h2 class="card-title" id="briefTitle">Loading...</h2>
            <p class="card-desc" id="briefDesc"></p>
        </div>

        <!-- ONLY THESE ACTIONS -->
        <div class="card-actions">

            <div class="level-toggle">
                <button class="level-btn active" onclick="setBriefLevel('beginner', this)">B</button>
                <button class="level-btn" onclick="setBriefLevel('intermediate', this)">I</button>
                <button class="level-btn" onclick="setBriefLevel('advanced', this)">A</button>
            </div>

            <button class="chatbot-btn" onclick="toggleBot(this)">
                <img src="/static/images/bot.svg">
                <span>Ask Bot</span>
            </button>

        </div>

        <!-- BOT -->
        <div class="article-bot">
            <div class="bot-header">
                <div class="bot-title">
                    <img src="/static/images/bot-white.png">
                    <span>Article Bot</span>
                </div>
                <button class="close-bot" onclick="toggleBot(this)">✕</button>
            </div>

            <div class="bot-body">
                <div class="bot-message">
                    Ask me anything about this flashcard.
                </div>

                <div class="bot-chat"></div>

                <div class="bot-input">
                    <input id="articleChatInput" type="text" placeholder="Ask about this article...">
                    <button onclick="sendArticleChat(this)">
                        <img src="/static/images/send.png">
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

            <!-- CONTROLS -->
                <div class="brief-controls">
                    <button class="brief-btn prev" onclick="prevBrief()">←  Prev</button>
                    <button class="brief-btn next" onclick="nextBrief()">Next  →</button>
                </div>

        </div>

    </main>

</div>


<script src="/static/js/dailyBrief.js"></script>
<!-- <script src="/static/js/news.js"></script> -->

</body>
</html>
