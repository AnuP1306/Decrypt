<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decrypt</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}"> <!-- ✅ ADD THIS -->

    <style>
        body {
            margin: 0;
            background: #F7F3F0;
            font-family: 'Space Grotesk', sans-serif;
        }
    </style>
</head>

<body class="landing-body">  <!-- ✅ THIS IS THE CHANGE -->

    {% block content %}{% endblock %}

  <script>
document.addEventListener("DOMContentLoaded", function () {

  const texts = [
    "it’s giving knowledge",
    "no cap, fr fr 🔥",
    "learn faster than reels",
    "Built Different",
    "Understood the assignment"
  ];

  let index = 0;

  const text1 = document.getElementById("text1");
  const text2 = document.getElementById("text2");

  let current = text1;
  let next = text2;

  function animateText() {

    index = (index + 1) % texts.length;
    next.textContent = texts[index];

    // START BOTH ANIMATIONS TOGETHER (key fix)
    current.classList.remove("active");
    current.classList.add("exit");

    next.classList.add("active");

    setTimeout(() => {
      current.classList.remove("exit");

      let temp = current;
      current = next;
      next = temp;

    }, 500);

  }

  setInterval(animateText, 2500);

});
</script>
</body>
</html>
