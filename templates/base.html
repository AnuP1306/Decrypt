<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decrypt</title>

    <!-- 🔤 Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap&family=Inter:wght@400;500&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">

    <!-- 🎨 Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<script>
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("collapsed");
    }
    </script>

<body>

    <!-- 🔝 Navbar -->
    {% include "components/navbar.html" %}

    <div class="layout">

        <!-- 📌 Sidebar -->
        {% include "components/sidebar.html" %}

        <!-- 📄 Main Content -->
        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>

    </div>

    <!-- 🔻 Footer -->
    {% include "components/footer.html" %}
    <script>
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("collapsed");
            document.querySelector(".layout").classList.toggle("collapsed");
        }
        </script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/opportunities.css') }}">

{% block scripts %}
<script>
const buttons = document.querySelectorAll('.opp-filters button');
const cards = document.querySelectorAll('.opp-card');

buttons.forEach(btn => {
  btn.addEventListener('click', () => {

    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const filter = btn.innerText.trim();

    cards.forEach(card => {
      const type = card.getAttribute('data-type');

      if (filter === "All" || type === filter) {
        card.style.display = "flex";
      } else {
        card.style.display = "none";
      }
    });

  });
});
</script>
{% endblock %}
</body>
</html>
