<div class="sidebar" id="sidebar">

   
    <div class="sidebar-top">
        <div class="user-info">
            <div class="user-avatar">U</div>
            <div class="user-text">
                <p class="user-name">Anushka</p>
                <span class="user-role">Explorer · Intermediate</span>
            </div>

            <button class="menu-toggle" onclick="toggleSidebar()">
                <img src="{{ url_for('static', filename='images/menu.png') }}">
            </button>
        </div>
    </div>

    
    <div class="sidebar-menu">

        <a href="{{ url_for('home.home') }}"
   class="menu-item {% if request.path.startswith('/home') %}active{% endif %}">
    <img src="{{ url_for('static', filename='images/home.png') }}">
    <span>Home Feed</span>
</a>

        <div class="menu-item">
            <img src="{{ url_for('static', filename='images/bolt.png') }}">
            <span>Daily Brief</span>
        </div>

       <a href="/tools" class="menu-item {% if request.path == '/tools' %}active{% endif %}">
    <img src="{{ url_for('static', filename='images/tools-1.png') }}">
    <span>Tools Library</span>
</a>

       <a href="{{ url_for('opportunities.opportunities_page') }}"
   class="menu-item {% if request.path == '/opportunities' %}active{% endif %}">
    <img src="{{ url_for('static', filename='images/opportunity.png') }}">
    <span>Student Opportunities</span>
</a>

        <div class="menu-item">
            <img src="{{ url_for('static', filename='images/saved.png') }}">
            <span>Saved Items</span>
        </div>

    </div>

    
    <div class="sidebar-bottom">

        <div class="menu-item">
            <img src="{{ url_for('static', filename='images/bell.png') }}">
            <span>Notifications</span>
        </div>

        <div class="menu-item">
            <img src="{{ url_for('static', filename='images/settings.png') }}">
            <span>Settings</span>
        </div>

   <a href="{{ url_for('home.logout') }}" class="menu-item logout">
    <img src="{{ url_for('static', filename='images/logout.png') }}">
    <span>Log Out</span>
</a>
    </div>

</div>
